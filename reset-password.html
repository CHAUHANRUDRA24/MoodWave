<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Moodwave - Reset Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1db954",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .glass-effect {
            background: rgba(27, 49, 35, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-mesh {
            background-color: #122017;
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 185, 84, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(29, 185, 84, 0.1) 0px, transparent 50%);
        }

        /* Dynamic Click Effect Styles */
        .click-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #1DB954;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple-anim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-anim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 0px; }
        }

        .cursor-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: particle-anim 0.8s cubic-bezier(0, .9, .57, 1) forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes particle-anim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <div class="relative flex min-h-screen w-full flex-col bg-mesh overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col items-center">
            
            <!-- Header -->
            <header class="w-full max-w-[960px] flex items-center justify-between whitespace-nowrap border-b border-solid border-white/10 px-6 md:px-10 py-5">
                <div class="flex items-center gap-3">
                    <div class="size-8 text-primary">
                        <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <g clip-path="url(#clip0_6_330)">
                                <path clip-rule="evenodd" d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 0.757355ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z" fill="currentColor" fill-rule="evenodd"></path>
                            </g>
                            <defs>
                                <clipPath id="clip0_6_330"><rect fill="white" height="48" width="48"></rect></clipPath>
                            </defs>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold leading-tight tracking-[-0.015em] text-slate-100">Moodwave</h2>
                </div>
                <button class="flex size-10 cursor-pointer items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-slate-300 transition-colors">
                    <span class="material-symbols-outlined" style="font-size: 20px;">help_outline</span>
                </button>
            </header>

            <!-- Main Content -->
            <main class="flex-1 flex items-center justify-center w-full px-4 py-12">
                <div class="glass-effect w-full max-w-md p-8 md:p-10 rounded-3xl shadow-2xl relative z-10">
                    <div class="flex flex-col gap-2 mb-8 text-center">
                        <div class="mx-auto mb-4 size-16 rounded-2xl bg-primary/10 flex items-center justify-center text-primary">
                            <span class="material-symbols-outlined" style="font-size: 32px;">lock_reset</span>
                        </div>
                        <h1 class="text-3xl font-black leading-tight tracking-[-0.033em] text-slate-100">Reset Password</h1>
                        <p class="text-slate-400 text-base font-normal leading-relaxed">
                            No worries, it happens. Enter your email and we'll send you a secure link to get back into your groove.
                        </p>
                    </div>
                    
                    <form id="reset-form" class="flex flex-col gap-6" onsubmit="return false;">
                        <div class="flex flex-col gap-2">
                            <label for="email" class="text-slate-200 text-sm font-semibold tracking-wide uppercase ml-1">
                                Email Address
                            </label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
                                    <span class="material-symbols-outlined" style="font-size: 20px;">mail</span>
                                </div>
                                <input id="email" required class="form-input flex w-full rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary/50 border border-white/10 bg-white/5 focus:border-primary/50 h-14 pl-12 pr-4 placeholder:text-slate-600 text-base font-normal transition-all" placeholder="your@email.com" type="email"/>
                            </div>
                        </div>

                        <!-- Alert message container -->
                        <div id="alert-message" class="hidden text-sm font-medium py-3 px-4 rounded-xl"></div>

                        <button id="submit-btn" class="w-full flex cursor-pointer items-center justify-center gap-2 rounded-xl h-14 bg-primary hover:bg-primary/90 text-background-dark text-base font-bold leading-normal tracking-[0.015em] transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20">
                            <span id="btn-text" class="truncate">Send Reset Link</span>
                            <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-background-dark/30 border-t-background-dark rounded-full animate-spin"></div>
                        </button>
                    </form>
                    
                    <div class="mt-10 text-center">
                        <a class="inline-flex items-center gap-2 text-slate-400 hover:text-primary text-sm font-medium transition-colors group" href="/">
                            <span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" style="font-size: 18px;">arrow_back</span>
                            Back to Signup
                        </a>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <footer class="w-full max-w-[960px] py-8 px-6 text-center z-10">
                <p class="text-slate-500 text-xs text-center w-full">
                    © 2024 Moodwave Music. All rights reserved.
                </p>
            </footer>
        </div>

        <!-- Background Decoration -->
        <div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
            <div class="absolute top-1/4 -left-20 size-80 bg-primary/20 blur-[100px] rounded-full"></div>
            <div class="absolute bottom-1/4 -right-20 size-80 bg-primary/10 blur-[100px] rounded-full"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('reset-form');
            const alertMessage = document.getElementById('alert-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            function showAlert(message, type) {
                alertMessage.textContent = message;
                alertMessage.className = `text-sm font-medium py-3 px-4 rounded-xl mb-4 ${
                    type === 'error' ? 'bg-red-500/20 text-red-200 border border-red-500/50' : 
                    'bg-green-500/20 text-green-200 border border-green-500/50'
                }`;
                alertMessage.classList.remove('hidden');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                alertMessage.classList.add('hidden');
                const email = document.getElementById('email').value;

                // Set loading state
                btnText.textContent = 'Sending Link...';
                btnSpinner.classList.remove('hidden');
                submitBtn.disabled = true;

                try {
                    // Simulate an API call
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    // Redirect to success page
                    window.location.href = '/reset-success';
                } catch (error) {
                    console.error('Error submitting form:', error);
                    showAlert('Something went wrong. Please try again later.', 'error');
                } finally {
                    // Reset loading state
                    btnText.textContent = 'Send Reset Link';
                    btnSpinner.classList.add('hidden');
                    submitBtn.disabled = false;
                }
            });

            // Dynamic Click Effect Logic
            function createParticle(x, y) {
                const particle = document.createElement('div');
                particle.className = 'cursor-particle';
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 50; 
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                
                const colors = ['#1DB954', '#ffffff', '#a7f3d0'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }

            document.addEventListener('click', function(e) {
                // Ripple
                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = `${e.pageX}px`;
                ripple.style.top = `${e.pageY}px`;
                document.body.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);

                // Particles
                for (let i = 0; i < 8; i++) {
                    createParticle(e.pageX, e.pageY);
                }
            });
        });
    </script>
</body>
</html>
