<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Moodwave - Success</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1db954",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017",
                    },
                    fontFamily: {
                        "display": ["Spline Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .glass-morphism {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .moody-gradient {
            background: radial-gradient(circle at top left, #1b3a27, #122017 60%);
        }

        /* Dynamic Click Effect Styles */
        .click-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #1DB954;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple-anim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-anim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 0px; }
        }

        .cursor-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: particle-anim 0.8s cubic-bezier(0, .9, .57, 1) forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes particle-anim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center moody-gradient overflow-hidden">
    <!-- Background decorative elements -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-primary/5 rounded-full blur-[100px]"></div>
    <div class="layout-container flex h-full grow flex-col w-full items-center">
        <!-- Header/Logo Area -->
        <header class="flex items-center justify-between w-full max-w-[1200px] px-6 py-8 absolute top-0">
            <div class="flex items-center gap-2 text-slate-100">
                <div class="flex items-center justify-center p-2 rounded-lg bg-primary/20">
                    <span class="material-symbols-outlined text-primary">waves</span>
                </div>
                <h2 class="text-xl font-bold leading-tight tracking-tight">Moodwave</h2>
            </div>
        </header>

        <!-- Main Success Card -->
        <main class="flex flex-1 items-center justify-center p-6 w-full z-10">
            <div class="glass-morphism w-full max-w-[440px] rounded-xl p-10 flex flex-col items-center text-center shadow-2xl relative">
                <!-- Icon Section -->
                <div class="mb-8 relative">
                    <div class="absolute inset-0 bg-primary/20 blur-xl rounded-full scale-150"></div>
                    <div class="relative flex items-center justify-center w-24 h-24 rounded-full bg-primary/10 border border-primary/30">
                        <span class="material-symbols-outlined text-primary text-5xl font-bold">check_circle</span>
                    </div>
                </div>
                <!-- Content Section -->
                <h1 class="text-slate-100 tracking-tight text-3xl font-bold mb-4">Success!</h1>
                <p class="text-slate-400 text-lg font-normal leading-relaxed mb-10 max-w-[300px]">
                    Your password has been successfully reset. You can now use your new password to sign in.
                </p>
                <!-- Action Button -->
                <div class="w-full">
                    <a href="/" class="w-full flex cursor-pointer items-center justify-center rounded-lg h-14 px-6 bg-primary hover:bg-primary/90 transition-colors text-background-dark text-base font-bold leading-normal tracking-wide shadow-lg shadow-primary/20">
                        <span class="truncate">Return to Login</span>
                    </a>
                </div>
                <!-- Footer link -->
                <p class="mt-8 text-sm text-slate-500">
                    Need help? <a class="text-primary hover:underline" href="#">Contact Support</a>
                </p>
            </div>
        </main>

        <!-- Bottom Navigation/Spacing -->
        <footer class="w-full py-8 text-center text-slate-600 text-xs z-10">
            © 2024 Moodwave AI. All rights reserved.
        </footer>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Dynamic Click Effect Logic
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'cursor-particle';
            
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = 50 + Math.random() * 50; 
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);
            
            const colors = ['#1DB954', '#ffffff', '#a7f3d0'];
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 800);
        }

        document.addEventListener('click', function(e) {
            // Ripple
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = `${e.pageX}px`;
            ripple.style.top = `${e.pageY}px`;
            document.body.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);

            // Particles
            for (let i = 0; i < 8; i++) {
                createParticle(e.pageX, e.pageY);
            }
        });
    });
</script>
</body>
</html>
