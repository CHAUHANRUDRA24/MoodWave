<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Moodwave - Log In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1DB954",
                        "background-light": "#000000",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-gradient-mesh {
            background-color: #000000;
        }

        /* Dynamic Click Effect Styles */
        .click-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #1DB954;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple-anim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes ripple-anim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 0px; }
        }

        .cursor-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: particle-anim 0.8s cubic-bezier(0, .9, .57, 1) forwards;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes particle-anim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 selection:bg-primary/30">
<div class="relative min-h-screen w-full flex flex-col items-center justify-center bg-gradient-mesh p-4 md:p-8 overflow-x-hidden">
    
    <!-- Header -->
    <header class="absolute top-0 left-0 w-full px-6 py-6 md:px-12 flex items-center justify-between z-20">
        <div class="flex items-center gap-3">
            <div class="bg-primary p-1.5 rounded-lg flex items-center justify-center shadow-lg shadow-primary/20">
                <span class="material-symbols-outlined text-white text-2xl">waves</span>
            </div>
            <div class="flex flex-col">
                <h1 class="text-xl font-black tracking-tighter text-slate-100 leading-none">MOODWAVE</h1>
                <span class="text-[10px] text-primary font-bold tracking-[0.2em] uppercase">Full Stack Player</span>
            </div>
        </div>
        <div class="hidden md:flex items-center gap-6">
            <p class="text-slate-400 text-sm">Need an account? <a class="text-primary font-semibold hover:underline" href="/">Sign up</a></p>
        </div>
    </header>

    <main class="w-full max-w-6xl z-10 flex flex-col items-center justify-center gap-12 mt-12 md:mt-0">
        
        <!-- Login Form -->
        <div class="w-full max-w-[440px]">
            <div class="glass-panel rounded-3xl p-8 md:p-10 shadow-2xl relative overflow-hidden">
                <!-- Tech Badge -->
                <div class="absolute -right-12 -top-12 w-32 h-32 bg-primary/10 rounded-full blur-2xl"></div>
                
                <div class="mb-8 text-center relative z-10">
                    <h2 class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h2>
                    <p class="text-slate-400">Log in to Moodwave.</p>
                </div>
                
                <form id="login-form" class="space-y-5 relative z-10">
                    <div class="space-y-2">
                        <label for="email" class="text-xs font-semibold uppercase tracking-wider text-slate-400 ml-1">Email Address</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">mail</span>
                            <input id="email" required class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="your@email.com" type="email"/>
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <div class="flex items-center justify-between ml-1 mr-1">
                            <label for="password" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                            <a href="/reset-password" class="text-xs text-primary hover:underline font-medium">Forgot?</a>
                        </div>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">lock</span>
                            <input id="password" required class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="••••••••" type="password"/>
                        </div>
                    </div>

                    <!-- Alert message container -->
                    <div id="alert-message" class="hidden text-sm font-medium py-3 px-4 rounded-xl"></div>
                    
                    <button id="submit-btn" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98] mt-4 flex justify-center items-center gap-2" type="submit">
                        <span id="btn-text">Sign In</span>
                        <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    </button>
                    
                    <p class="text-center text-slate-400 text-sm mt-6 md:hidden">Need an account? <a class="text-primary font-semibold hover:underline" href="/">Sign up</a></p>
                </form>
            </div>
        </div>
    </main>

    <!-- Background Decoration -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/10 blur-[120px] rounded-full opacity-50"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary/5 blur-[120px] rounded-full opacity-30"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 blur-[160px] rounded-full"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('login-form');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        function showAlert(message, type) {
            alertMessage.textContent = message;
            alertMessage.className = `text-sm font-medium py-3 px-4 rounded-xl mb-4 ${
                type === 'error' ? 'bg-red-500/20 text-red-200 border border-red-500/50' : 
                'bg-green-500/20 text-green-200 border border-green-500/50'
            }`;
            alertMessage.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide previous alerts
            alertMessage.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Set loading state
            btnText.textContent = 'Signing in...';
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                // Send request to the Node.js backend
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Signed in successfully! Redirecting...', 'success');
                    // Add token to localStorage
                    localStorage.setItem('moodwave_token', data.token);
                    
                    // Redirect to dashboard (if it exists) or simulate loading.
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Invalid credentials.', 'error');
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                showAlert('Could not connect to the server. Please make sure the backend is running.', 'error');
            } finally {
                // Reset loading state
                btnText.textContent = 'Sign In';
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        // Dynamic Click Effect Logic
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'cursor-particle';
            
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = 50 + Math.random() * 50; 
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);
            
            const colors = ['#1DB954', '#ffffff', '#a7f3d0'];
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 800);
        }

        document.addEventListener('click', function(e) {
            if(e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'a') return; // Skip effects on inputs to prevent annoying UI
            
            // Ripple
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = `${e.pageX}px`;
            ripple.style.top = `${e.pageY}px`;
            document.body.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);

            // Particles
            for (let i = 0; i < 8; i++) {
                createParticle(e.pageX, e.pageY);
            }
        });
    });
</script>
</body>
</html>
